<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Support Copilot Demo</title>
    <style>
      :root {
        --bg: #fbfbfa;
        --fg: #1d1d1b;
        --muted: #6b6b66;
        --line: #e3e2de;
        --accent: #2457c5;
        --warn: #b42318;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #161615;
          --fg: #ecebe8;
          --muted: #9d9c97;
          --line: #2e2e2b;
          --accent: #7aa2ff;
          --warn: #ff6b5e;
        }
      }
      body {
        background: var(--bg);
        color: var(--fg);
        font:
          15px/1.5 system-ui,
          sans-serif;
        margin: 0;
        padding: 24px 16px;
      }
      main {
        max-width: 680px;
        margin: 0 auto;
      }
      h1 {
        font-size: 20px;
        margin: 0 0 4px;
      }
      p.lede {
        color: var(--muted);
        margin: 0 0 20px;
      }
      form {
        display: flex;
        gap: 8px;
      }
      textarea {
        flex: 1;
        min-height: 64px;
        padding: 8px;
        font: inherit;
        color: inherit;
        background: transparent;
        border: 1px solid var(--line);
        border-radius: 6px;
      }
      button {
        padding: 0 16px;
        font: inherit;
        border: 0;
        border-radius: 6px;
        background: var(--accent);
        color: #fff;
        cursor: pointer;
      }
      button:disabled {
        opacity: 0.6;
      }
      section {
        margin-top: 20px;
        border-top: 1px solid var(--line);
        padding-top: 16px;
      }
      .row {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-bottom: 8px;
      }
      .chip {
        border: 1px solid var(--line);
        border-radius: 999px;
        padding: 2px 10px;
        font-size: 13px;
      }
      .chip.escalate {
        border-color: var(--warn);
        color: var(--warn);
      }
      .muted {
        color: var(--muted);
        font-size: 13px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Support Copilot</h1>
      <p class="lede">Demo store assistant. Answers come from the knowledge base in <code>data/kb</code>.</p>
      <form id="ask">
        <label for="message" class="muted" hidden>Customer message</label>
        <textarea id="message" data-testid="message" placeholder="Where is my order?" required></textarea>
        <button type="submit" data-testid="send">Ask</button>
      </form>
      <section id="result" data-testid="result" hidden aria-live="polite">
        <div class="row">
          <span class="chip" data-testid="intent"></span>
          <span class="chip" data-testid="escalate"></span>
          <span class="chip" data-testid="confidence"></span>
        </div>
        <p data-testid="answer"></p>
        <p class="muted">Sources: <span data-testid="citations"></span></p>
      </section>
      <p class="muted" data-testid="error" hidden></p>
    </main>
    <script>
      const form = document.getElementById("ask");
      const $ = (id) => document.querySelector(`[data-testid="${id}"]`);
      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        $("send").disabled = true;
        $("error").hidden = true;
        try {
          const res = await fetch("/api/chat", {
            method: "POST",
            headers: { "content-type": "application/json" },
            body: JSON.stringify({ message: $("message").value }),
          });
          if (!res.ok) throw new Error(`Request failed (${res.status})`);
          const { output } = await res.json();
          $("intent").textContent = `intent: ${output.intent}`;
          $("escalate").textContent = output.escalate ? "handed to a person" : "self-serve";
          $("escalate").classList.toggle("escalate", output.escalate);
          $("confidence").textContent = `confidence ${output.confidence.toFixed(2)}`;
          $("answer").textContent = output.answer;
          $("citations").textContent = output.citations.length ? output.citations.join(", ") : "none";
          $("result").hidden = false;
        } catch (err) {
          $("error").textContent = err.message;
          $("error").hidden = false;
        } finally {
          $("send").disabled = false;
        }
      });
    </script>
  </body>
</html>
